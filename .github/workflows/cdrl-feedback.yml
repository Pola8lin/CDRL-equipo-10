name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U cdrl_dev -d cdrl; then
              echo "PostgreSQL está listo."
              exit 0
            fi
            echo "Esperando a PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL no estuvo listo a tiempo."
          docker compose logs postgres
          exit 1

      - name: Verify reproducibility contract
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          make setup
          # 1. Crea el archivo en una carpeta segura (/tmp) DESPUÉS de que el setup limpie todo
          # Si el secreto empieza con "{", es texto normal. Si no, lo decodifica de Base64.
          if [[ "${FIREBASE_SECRET}" == "{"* ]]; then
            echo "$FIREBASE_SECRET" > /tmp/firebase-credenciales.json
          else
            echo "$FIREBASE_SECRET" | base64 --decode > /tmp/firebase-credenciales.json
          fi
          
          # 2. Inyecta la ruta para el archivo DocumentStore
          echo "FIREBASE_CREDENTIALS_PATH=/tmp/firebase-credenciales.json" >> .env
          
          # 3. Fuerza a Firebase globalmente para reparar las pruebas de Auditoría
          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/firebase-credenciales.json"
          
          make verify