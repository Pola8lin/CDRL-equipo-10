name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U cdrl_dev -d cdrl; then
              echo "PostgreSQL está listo."
              exit 0
            fi
            echo "Esperando a PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL no estuvo listo a tiempo."
          docker compose logs postgres
          exit 1

      - name: Verify reproducibility contract
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          make setup
          # Comprueba que el secreto est? configurado.
          if [[ -z "${FIREBASE_SECRET}" ]]; then
            echo "Falta configurar FIREBASE_CREDENTIALS_BASE64."
            exit 1
          fi

          # Crea el archivo de credenciales despu?s de make setup.
          CREDENTIALS_FILE="/tmp/firebase-credenciales.json"

          if [[ "${FIREBASE_SECRET}" == "{"* ]]; then
            printf '%s' "$FIREBASE_SECRET" > "$CREDENTIALS_FILE"
          else
            printf '%s' "$FIREBASE_SECRET" | base64 --decode > "$CREDENTIALS_FILE"
          fi

          chmod 600 "$CREDENTIALS_FILE"

          # Comprueba que sea una cuenta de servicio v?lida.
          if ! python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert all(d.get(k) for k in ("project_id", "client_email", "private_key"))' "$CREDENTIALS_FILE" 2>/dev/null; then
            echo "Las credenciales de Firebase no son un JSON valido de cuenta de servicio."
            exit 1
          fi

          # Expone la ruta a la aplicaci?n y a las pruebas.
          echo "FIREBASE_CREDENTIALS_PATH=$CREDENTIALS_FILE" >> .env
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"
          make verify